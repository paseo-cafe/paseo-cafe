name: Barista

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["CI", "Registry admission"]
    types: [requested, completed]

permissions:
  contents: read

concurrency:
  group: >-
    barista-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted Barista code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Create Barista token
        id: barista
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.BARISTA_APP_ID }}
          private-key: ${{ secrets.BARISTA_APP_PEM }}
          permission-actions: write
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile pull request
        run: bun run scripts/barista.ts
        env:
          BARISTA_APP_SLUG: ${{ steps.barista.outputs.app-slug }}
          GITHUB_TOKEN: ${{ steps.barista.outputs.token }}
