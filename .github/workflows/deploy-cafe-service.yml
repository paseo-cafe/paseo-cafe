name: Deploy Cafe service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      enable_install_reporting:
        description: Accept install reports in this environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cafe-service-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Cafe service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cafe-service-${{ inputs.environment }}
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install service dependencies
        working-directory: services/cafe
        run: bun install --frozen-lockfile

      - name: Generate catalog allowlist
        working-directory: services/cafe
        run: bun run catalog:build

      - name: Check with Biome
        run: bun run check:service

      - name: Validate service
        working-directory: services/cafe
        run: |
          bun run typecheck
          bun run test
          bun run build

      - name: Deploy Worker
        working-directory: services/cafe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CAFE_ENV: ${{ inputs.environment }}
          REPORTING_ENABLED: ${{ inputs.enable_install_reporting }}
        run: ./node_modules/.bin/wrangler deploy --env "$CAFE_ENV" --var "REPORTING_ENABLED:$REPORTING_ENABLED"
