name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect affected projects
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            app:
              - "src/**"
              - "scripts/**"
              - "data/**"
              - "public/**"
              - "package.json"
              - "bun.lock"
              - "tsconfig.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "eslint.config.js"
              - ".prettier*"
              - "zerops.yaml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/enrich-and-deploy.yml"
            plugin:
              - "plugin/**"
              - "package.json"
              - "bun.lock"
              - "eslint.config.js"
              - ".prettier*"
              - ".github/workflows/ci.yml"

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run check:app

      - name: Lint
        run: bun run lint:app

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  plugin:
    name: Plugin
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install lint dependencies
        run: bun install --frozen-lockfile

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      - name: Check formatting
        run: bun run check:plugin

      - name: Lint
        run: bun run lint:plugin

      - name: Typecheck
        working-directory: plugin
        run: npm run typecheck

  all-checks:
    name: All checks passed
    needs: [changes, app, plugin]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_RESULT: ${{ needs.app.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$APP_RESULT" "$PLUGIN_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Required job failed: $result"
              exit 1
            fi
          done
