name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      plugin: ${{ steps.filter.outputs.plugin }}
      plugin_package: ${{ steps.filter.outputs.plugin_package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect affected projects
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - "src/**"
              - "scripts/**"
              - "registry/**"
              - "data/**"
              - "public/**"
              - "package.json"
              - "bun.lock"
              - "biome.json"
              - ".cta.json"
              - "tsconfig.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - ".github/workflows/ci.yml"
              - ".github/workflows/deploy-pages.yml"
              - "plugin/shared/catalog.ts"
            plugin:
              - "plugin/**"
              - "package.json"
              - "bun.lock"
              - "biome.json"
              - ".github/workflows/ci.yml"

            plugin_package:
              - "plugin/client/**"
              - "plugin/images/**"
              - "plugin/server/**"
              - "plugin/shared/**"
              - "plugin/index.client.tsx"
              - "plugin/index.server.ts"
              - "plugin/package.json"
              - "plugin/paseo-plugin.json"
              - "plugin/README.md"
  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: scripts/scan.ts derives each plugin's addedAt from
          # the commit that first added its registry entry, and a shallow
          # clone has no such history to read.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pull requests execute contributor-controlled code. Build a deterministic
      # local catalog and never expose credentials to this trust domain.
      - name: Generate offline registry fixtures
        run: bun run registry:scan:offline

      - name: Validate registry data locally
        run: bun run registry:validate
        env:
          SKIP_GITHUB_VALIDATION: "true"

      - name: Check with Biome
        run: bun run check:app

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build:generated

      # Everything above builds the canonical site: served from the root, at
      # its own domain. A fork's Pages site is neither, and the difference is
      # invisible here unless it is built — every regression in it so far was
      # found by a fork's deploy failing, not by CI. Building once more under
      # a base path catches a hardcoded "/" or "https://paseo.cafe" at the
      # pull request that adds it. build:generated ends in
      # scripts/verify-pages-entrypoint.ts, so this asserts a rendered
      # catalog, not just an exit code.
      - name: Build for a fork's base path
        run: bun run build:generated
        env:
          VITE_SITE_URL: https://example.github.io/paseo-cafe
          VITE_BASE_PATH: /paseo-cafe

  plugin:
    name: Plugin (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # The plugin is the only thing here that shells out to the Paseo CLI,
      # and it builds a different invocation per platform (cmd.exe on
      # Windows), so those branches have to run somewhere.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      # plugin/ has no Vitest config of its own, so `npm run test` resolves
      # the root one and needs Vitest installed there on every runner.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      # Formatting is platform-independent, and a Windows checkout's line
      # endings would make Biome disagree with itself.
      - name: Check with Biome
        if: runner.os == 'Linux'
        run: bun run check:plugin

      - name: Typecheck
        working-directory: plugin
        run: npm run typecheck

      - name: Test
        working-directory: plugin
        run: npm run test

  plugin-preview:
    name: Publish plugin preview
    needs: [changes, plugin]
    if: >-
      github.repository == 'paseo-cafe/paseo-cafe' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.plugin_package == 'true' &&
      needs.plugin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare npm package
        run: bun run scripts/prepare-plugin-package.ts "$RUNNER_TEMP/paseo-cafe"

      - name: Assign unique preview version
        working-directory: ${{ runner.temp }}/paseo-cafe
        run: >-
          npm version prerelease
          --preid="next.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          --no-git-tag-version

      - name: Verify npm package contents
        working-directory: ${{ runner.temp }}/paseo-cafe
        run: npm pack --dry-run

      - name: Publish npm package on next tag
        working-directory: ${{ runner.temp }}/paseo-cafe
        run: npm publish --access public --provenance --tag next

  all-checks:
    name: All checks passed
    needs: [changes, app, plugin, plugin-preview]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_RESULT: ${{ needs.app.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          PREVIEW_RESULT: ${{ needs.plugin-preview.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$APP_RESULT" "$PLUGIN_RESULT" "$PREVIEW_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Required job failed: $result"
              exit 1
            fi
          done
