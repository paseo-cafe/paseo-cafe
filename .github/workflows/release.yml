name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    name: Release plugin
    runs-on: ubuntu-latest
    # Only this repository publishes the plugin. On a fork every push to main
    # starts a release-please run that fails on permissions — or, worse,
    # half-succeeds and leaves a release branch behind — for a release nobody
    # is going to cut.
    if: >-
      github.repository == 'paseo-cafe/paseo-cafe' &&
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create release pull request or GitHub release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
