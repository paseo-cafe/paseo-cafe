name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Release plugin
    runs-on: ubuntu-latest
    # Only this repository publishes the plugin. On a fork every push to main
    # starts a release-please run that fails on permissions — or, worse,
    # half-succeeds and leaves a release branch behind — for a release nobody
    # is going to cut.
    if: github.repository == 'paseo-cafe/paseo-cafe'
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create release pull request or GitHub release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
