name: Enrich and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrich-and-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Enrich, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan registry
        run: bun run registry:scan
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify generated site
        run: |
          bun run check:app
          bun run typecheck
          bun run test
          bun run build:generated

      # Zerops uploads this working directory, so the verified generated tree
      # can ship without committing derived files to protected main.
      - name: Deploy to Zerops
        uses: zeropsio/actions@19329d7d7ecaad2c382fb30ea6e52aaa15ec1f20 # v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_SERVICE_ID }}
