name: Enrich and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrich-and-deploy
  cancel-in-progress: false

jobs:
  enrich:
    name: Enrich and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source-sha: ${{ steps.publish.outputs.source-sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan registry
        run: bun run registry:scan
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify generated site
        run: |
          bun run check:app
          bun run lint:app
          bun run typecheck
          bun run test
          bun run build

      - name: Publish refreshed data
        id: publish
        run: |
          git config user.name "paseo-cafe-bot"
          git config user.email "actions@github.com"
          git add data/ public/og public/sitemap.xml public/robots.txt
          git diff --cached --quiet || git commit -m "chore: refresh plugin data [skip ci]"
          git push
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Zerops
    needs: enrich
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.enrich.outputs.source-sha }}
          persist-credentials: false

      - name: Deploy to Zerops
        uses: zeropsio/actions@19329d7d7ecaad2c382fb30ea6e52aaa15ec1f20 # v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_SERVICE_ID }}
