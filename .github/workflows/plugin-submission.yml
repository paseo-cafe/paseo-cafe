name: Plugin submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plugin-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  submit:
    name: Open registry PR from issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted submission code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Create Barista token
        id: barista
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.BARISTA_APP_ID }}
          private-key: ${{ secrets.BARISTA_APP_PEM }}
          permission-actions: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Process submission issue
        run: bun run scripts/barista.ts
        env:
          GITHUB_TOKEN: ${{ steps.barista.outputs.token }}
          GITHUB_PR_CREATOR_TOKEN: ${{ github.token }}
