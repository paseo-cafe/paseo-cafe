name: Registry admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to scan
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: registry-admission-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  admission:
    name: Registry admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pull_request_target is privileged. Every executable file and dependency
      # must come from the trusted base commit; fork content is fetched as data.
      - name: Resolve pull request context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR_NUMBER:-$DISPATCH_PR_NUMBER}"
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A valid pull request number is required"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/pr.json"
          {
            echo "number=$pr_number"
            echo "base_sha=$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")"
            echo "head_repo=$(jq -r '.head.repo.full_name' "$RUNNER_TEMP/pr.json")"
            echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted admission code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Fetch changed registry entries as untrusted data
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          registry_dir="$RUNNER_TEMP/registry"
          mkdir "$registry_dir"
          changed=false
          count=0

          while IFS= read -r path; do
            case "$path" in
              registry/*.json)
                count=$((count + 1))
                if (( count > 20 )); then
                  echo "::error::A pull request may change at most 20 registry entries"
                  exit 1
                fi
                name="${path#registry/}"
                if [[ "$name" == */* ]]; then
                  echo "::error file=$path::Nested registry paths are not allowed"
                  exit 1
                fi
                changed=true
                metadata="$RUNNER_TEMP/registry-entry-$count.json"
                gh api \
                  "repos/$HEAD_REPO/contents/$path?ref=$HEAD_SHA" \
                  > "$metadata"
                size="$(jq -r '.size' "$metadata")"
                encoding="$(jq -r '.encoding' "$metadata")"
                if [[ ! "$size" =~ ^[0-9]+$ ]] || (( size > 65536 )); then
                  echo "::error file=$path::Registry entries must not exceed 64 KiB"
                  exit 1
                fi
                if [[ "$encoding" != base64 ]]; then
                  echo "::error file=$path::GitHub did not return base64 file content"
                  exit 1
                fi
                jq -r '.content' "$metadata" | tr -d '\n' |
                  base64 --decode > "$registry_dir/$name"
                ;;
            esac
          done < <(
            gh api --paginate \
              "repos/$BASE_REPO/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | select(.status != "removed") | .filename'
          )

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "directory=$registry_dir" >> "$GITHUB_OUTPUT"

      - name: Check changed registry entries with Biome
        if: steps.registry.outputs.changed == 'true'
        run: >-
          bun run biome check --error-on-warnings
          --config-path biome.json
          "${{ steps.registry.outputs.directory }}"

      - name: Validate changed registry entries
        id: validate
        if: steps.registry.outputs.changed == 'true'
        run: bun run registry:validate
        env:
          REGISTRY_DIR: ${{ steps.registry.outputs.directory }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve changed security targets
        id: targets
        if: steps.registry.outputs.changed == 'true'
        run: >-
          bun run security:targets
          --registry "${{ steps.registry.outputs.directory }}"
          --output "$RUNNER_TEMP/plugin-security-targets.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Scan changed plugins
        id: scan
        if: steps.targets.outputs.count != '0'
        continue-on-error: true
        run: >-
          bun run security:scan
          --targets "$RUNNER_TEMP/plugin-security-targets.json"
          --report "$RUNNER_TEMP/plugin-security-report.md"
          --json "$RUNNER_TEMP/plugin-security-results.json"

      - name: Write empty admission report
        if: steps.registry.outputs.changed == 'true' && steps.targets.outputs.count == '0'
        run: printf '# Registry admission\n\nNo plugins require a security scan.\n' > "$RUNNER_TEMP/plugin-security-report.md"

      - name: Publish admission report
        id: publish
        if: always() && steps.registry.outputs.changed == 'true' && steps.targets.outcome == 'success'
        run: >-
          bun run security:publish
          "$RUNNER_TEMP/plugin-security-report.md"
          "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Enforce admission result
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.registry.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TARGETS_OUTCOME: ${{ steps.targets.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          CHANGED: ${{ steps.registry.outputs.changed }}
        run: |
          test "$FETCH_OUTCOME" = success
          if [[ "$CHANGED" == true ]]; then
            test "$VALIDATE_OUTCOME" = success
            test "$TARGETS_OUTCOME" = success
            test "$SCAN_OUTCOME" = success -o "$SCAN_OUTCOME" = skipped
            test "$PUBLISH_OUTCOME" = success
          fi
