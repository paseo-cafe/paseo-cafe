zerops:
  # `setup` must match the hostname of the Service you create in the Zerops
  # project (Project settings -> the service's "Hostname"). Rename this to
  # match — e.g. `app` if that's what you called it — before the first deploy.
  - setup: app
    build:
      base: bun@1.3
      buildCommands:
        - bun install --frozen-lockfile
        - test -n "$RUNTIME_GITHUB_TOKEN"
        - GITHUB_TOKEN="$RUNTIME_GITHUB_TOKEN" bun run registry:scan
        - bun run build:generated

      # Nitro (wired up in vite.config.ts) bundles the SSR build into a
      # single self-contained server at .output/server/index.mjs with all
      # deps inlined, plus the prebuilt client assets under .output/public.
      # No node_modules needed at runtime — this directory is everything.
      deployFiles:
        - .output

      cache:
        - node_modules

    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /

    run:
      base: bun@1.3
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
      start: bun run .output/server/index.mjs
